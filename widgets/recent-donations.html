<!-- ============================================================
  Recent Donations — embeddable HTML

  Paste into any page that allows custom HTML/JS (a website builder's code block,
  a CMS HTML widget, a static page, etc.).

  Replace the two placeholders before pasting:
    {{SUPABASE_URL}}              e.g. https://xyzxyz.supabase.co
    {{SUPABASE_PUBLISHABLE_KEY}}  your publishable key, sb_publishable_... (safe to expose)

  Behaviour:
  - Shows the 10 most recent donation events (each billing cycle of a
    recurring donation counts as its own event, same as in the database)
  - Named donors show their name; anonymous donors show their generated name
  - Updates live in real time as donations arrive
  - No SQL setup needed beyond what's in the README — this reads directly
    from the `donations` table, which the anon role can already SELECT from
    (RLS policy "Public read")
  ============================================================ -->

<div class="rd-wrap">
  <div class="rd-header">
    <div class="rd-title-row">
      <span class="rd-bolt" aria-hidden="true">⚡</span>
      <div>
        <h3 class="rd-title">Recent Donations</h3>
        <p class="rd-subtitle">Latest gifts · live updates</p>
      </div>
      <span class="rd-live-dot" title="Live data"></span>
    </div>
  </div>

  <ol id="rd-list" aria-live="polite" aria-label="Recent donations">
    <li class="rd-state">Loading…</li>
  </ol>
</div>

<script type="module">
  const SUPABASE_URL      = "{{SUPABASE_URL}}";
  const SUPABASE_ANON_KEY = "{{SUPABASE_PUBLISHABLE_KEY}}";
  const RECENT_N = 10;

  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const list     = document.getElementById("rd-list");

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g,
      t => ({ "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;" }[t]));
  }

  function formatCurrency(amount, currency) {
    return Number(amount).toLocaleString("en-US", {
      style: "currency",
      currency: currency.toUpperCase(),
      minimumFractionDigits: 0,
      maximumFractionDigits: 0,
    });
  }

  function timeAgo(isoString) {
    const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
    if (seconds < 45) return "just now";
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}d ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}mo ago`;
    return `${Math.floor(months / 12)}y ago`;
  }

  async function fetchRecent() {
    const { data, error } = await supabase
      .from("donations")
      .select("name, original_amount, original_currency, amount_usd, stripe_subscription_id, created_at")
      .order("created_at", { ascending: false })
      .limit(RECENT_N);

    if (error) throw error;
    return data;
  }

  function render(rows) {
    if (!rows || !rows.length) {
      list.innerHTML = `<li class="rd-state">No donations yet — be the first! 🎉</li>`;
      return;
    }

    list.innerHTML = rows.map((row, i) => {
      const name       = escapeHTML(row.name);
      const currency   = (row.original_currency || "usd").toLowerCase();
      const isUSD      = currency === "usd";
      const isRecurring = !!row.stripe_subscription_id;
      const primary    = formatCurrency(row.original_amount, currency);
      const usdNote    = isUSD
        ? ""
        : `<span class="rd-usd-note">≈ ${formatCurrency(row.amount_usd, "usd")}</span>`;
      const recurBadge = isRecurring
        ? `<span class="rd-recur-badge" title="Recurring donation">↻</span>`
        : "";

      return `
        <li class="rd-item" style="animation-delay:${i * 55}ms">
          <span class="rd-dot" aria-hidden="true"></span>
          <span class="rd-main">
            <span class="rd-name">${name}${recurBadge}</span>
            <span class="rd-time">${timeAgo(row.created_at)}</span>
          </span>
          <span class="rd-amount">${primary}${usdNote}</span>
        </li>`;
    }).join("");
  }

  async function refresh() {
    try {
      const rows = await fetchRecent();
      render(rows);
    } catch (err) {
      console.error("Recent donations error:", err);
      list.innerHTML = `<li class="rd-state rd-error">Could not load recent donations. Please refresh.</li>`;
    }
  }

  await refresh();

  // Refresh on any insert/update/delete (new gifts, refund adjustments, refund removals)
  supabase
    .channel("donations-recent-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "donations" }, () => {
      refresh();
    })
    .subscribe();

  // Keep "time ago" labels fresh without waiting for a new donation
  setInterval(refresh, 60000);
</script>
